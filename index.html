<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ページタイトル</title>
</head>
<body class="bg-gray-200">
    <div class="bg-blue-200 max-w-md mx-auto rounded-lg flex items-center p-8 gap-2">
        <input
        type="text" 
        class="rounded-lg flex-1 text-center"
        id="username"
        placeholder="githubユーザー名">
        <button 
        id="searchBtn"
        class="rounded-lg font-bold text-sm">検索</button>
    </div>

    <!--↓エラーメッセージ-->
    <p 
    id="errormassage"
    class="text-red-500 text-center mt-4"
    ></p>

    <!-- ユーザー情報を表示する場所 --> 
    <div 
    id="userInfo" 
    class="bg-white 
    rounded-lg mt-6 p-6" 
    ></div><!--GitHub APIがJSON形式のデータを返してくれるから画像とかいちいち書かなくてもいい-->
</body>

<script>
    //asyncとawaitはセット、loaduserをasync関数として定義し,最後に呼び出して実行している
    //=>か()の違いは,宣言関数かアロー関数か
    async function loaduser () {

    const username = document.getElementById("userInfo");

    try{
        const response = await fetch("https://jsonplaceholder.typicode.com/users")//fetchは、指定したURLにアクセスしてデータを取得するための命令。
        
        if(!response.ok) {
            throw new Error ("通信エラー" + response.status)
        } 

        const users = await response.json();//JSONの読み取りが終わるまで待ってから users に入れる,
                                           //APIから返ってきたデータを、JSONとして読み取って、JavaScriptで使えるデータにするという処理。

        username.textContent = "";//何回もサイトを使う想定で,開くたびに消えるよう設定

        users.forEach((user) => {
            const card = document.createElement("div")
            card.className = "bg-white rounded-lg shadow p-4";

            const name = document.createElement("h2");
            name.className = "text-lg font-bold";
            name.textContent = user.name;//userオブジェクトが持つnameプロパティの値をセットしている、という意味←プロパティはAPIに入ってる(あっちから送られてくる)
        
            const email = document.createElement("p");
            email.className = "text-gray-600 text-sm";
            email.textContent = user.email;//上に同じ

            card.appendChild(name);
            card.appendChild(email);
            username.appendChild(card);
        });
        }   catch (error) {
            username.textContent = "データの取得に失敗しました。";
            console.error(error);
            }
    }
    document.getElementById("searchBtn").addEventListener("click", loaduser);

</script>
